{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <div class="row">
        <h1 class="page-header">Reports</h1>
    </div>
    <div id="flashes" class="row"></div>

    <!-- LISTA -->
    <div id="listView">
        <div class="panel panel-default">
            <div class="panel-heading">Nuevo informe</div>
            <div class="panel-body">
                <form class="form-inline" id="newReportForm">
                    <div class="form-group">
                        <label>Origen</label>
                        <select class="form-control" id="subjectKind">
                            <option value="campaign">Campaña</option>
                            <option value="campaign_group">Grupo de campañas</option>
                        </select>
                    </div>
                    <div class="form-group" style="position:relative">
                        <label>Campaña / Grupo</label>
                        <input type="text" class="form-control" id="subjectSearch" autocomplete="off" placeholder="Buscar por nombre…" style="min-width:240px">
                        <div id="subjectDropdown" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:1050; max-height:220px; overflow-y:auto; background:#fff; border:1px solid #ccc; border-radius:0 0 4px 4px; box-shadow:0 4px 8px rgba(0,0,0,.15);"></div>
                        <input type="hidden" id="subjectId">
                    </div>
                    <div class="form-group">
                        <label>Plantilla</label>
                        <select class="form-control" id="templateId" style="min-width:220px"></select>
                    </div>
                    <div class="form-group">
                        <label>Empresa</label>
                        <input type="text" class="form-control" id="companyName" placeholder="Empresa Ejemplo, S.A.">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa fa-plus"></i> Crear y editar</button>
                </form>
            </div>
        </div>
        <h3>Informes</h3>
        <div id="reportsList"><p class="text-muted">Cargando…</p></div>
    </div>

    <!-- EDITOR (por secciones) -->
    <div id="editorView" style="display:none">
        <button class="btn btn-default btn-sm" onclick="closeEditor()"><i class="fa fa-arrow-left"></i> Volver</button>
        <strong id="editorTitle" style="margin-left:10px"></strong>
        <div id="statusBar" style="margin:14px 0"></div>
        <p class="text-muted" style="font-size:.85em"><span class="text-danger">*</span> Campos obligatorios. Debes completarlos antes de generar el informe.</p>
        <div id="validationSummary"></div>
        <div id="sections"></div>
        <div class="panel panel-default" style="margin-top:14px">
            <div class="panel-body">
                <button class="btn btn-default" onclick="saveFields()"><i class="fa fa-save"></i> Guardar campos</button>
                <button class="btn btn-primary" onclick="generateCurrent()"><i class="fa fa-cogs"></i> Generar informe</button>
                <span id="genResult" style="margin-left:12px"></span>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/js/dist/app/reportCommon.min.js"></script>
<script src="/js/dist/app/reports.min.js"></script>
{{end}}
